name: Zero-Capital Daily Newsletter

on:
  schedule:
    # 매일 UTC 21:17 (KST 기준 다음날 오전 6:17) 자동 실행 (트래픽 분산 최적화)
    - cron: '17 21 * * *'
  workflow_dispatch: # 수동 실행 허용 버튼

# 워크플로우 최상단 권한 설정: 레포지토리 커밋 및 GitHub Pages 배포 필수 권한
permissions:
  contents: write
  pages: write
  id-token: write

# GitHub Pages 동시 배포 충돌 방지
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 1. 빌드 및 데이터 생성 Job
  build:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Seoul'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Step 1: Fetching target media feeds..."
          python src/fetcher.py
          
          echo "Step 2: Analyzing with Gemini AI..."
          python src/analyzer.py
          
          echo "Step 3: Generating Newsletter artifacts..."
          python src/generator.py

      # Git 변경사항 커밋 및 푸시 (빈 커밋 스킵으로 중복 방지)
      - name: Commit and Push Daily Newsletter
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/
          git commit -m "Auto-generate daily newsletter [skip ci]" || echo "No changes to commit"
          git push

      # GitHub Pages 배포 아티팩트 업로드 (dist 폴더 대상)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # 2. GitHub Pages 배포 전용 Job (공식 권장 규격)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # GitHub Pages 배포 실행
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
